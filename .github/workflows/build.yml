name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.x'
          channel: 'stable'
      - run: |
          if [ -d "tamil_learning_app" ]; then
            cd tamil_learning_app
          fi
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            tamil_learning_app/build/app/outputs/flutter-apk/app-release.apk
